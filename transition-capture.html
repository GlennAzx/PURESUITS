<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>transition capture v2</title>
    <style>
      /* Capture-only. Whole tiles only: any tile whose rotated bounds would
         cross the frame is dropped, so nothing is cut off at the sprite edge.
         Gaps are allowed — the app paints a blue field behind the sprite. */
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
      #stage { position: relative; width: 100vw; height: 100vh; }

      .t {
        position: absolute;
        border-radius: 5px;
        display: grid;
        place-items: center;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5), inset 0 -3px 0 rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(40, 30, 20, 0.28);
        background: linear-gradient(180deg, #fffdf6 0%, #f4f1e4 68%, #e6e1cf 100%);
      }
      /* Backs are green, the way the plain side of a mahjong tile reads: the
         same jade family as the site's tile wall, not a pink shell. */
      .t--back {
        background: linear-gradient(180deg, #cfe7d6 0%, #a8cdb6 58%, #7aa88c 100%);
        border-color: rgba(28, 60, 44, 0.34);
      }
      .g { font-family: "Noto Serif SC", "Microsoft YaHei", serif; font-weight: 700; line-height: 1; }
      .g--wind { color: #22384f; }
      .g--red { color: #b02a1c; }
      .g--green { color: #1c6b3c; }
      .frame { width: 58%; height: 68%; border: 2px solid #2b5fa8; border-radius: 2px; }
      .pips { display: grid; grid-template-columns: repeat(3, 1fr); place-items: center; width: 62%; height: 70%; }
      .pips i { border-radius: 50%; background: #22384f; display: block; }
      .pips i:nth-child(3n + 1) { background: #b02a1c; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      const W = window.innerWidth;
      const H = window.innerHeight;
      const WINDS = ['東', '南', '西', '北'];

      function seeded(a) {
        return function next() {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = seeded(44821);

      const BASE = 86;        // nominal tile width
      const AMP = 5;          // churn amplitude, kept small so the drift stays uniform
      const PAD = 120;        // keeps a whole rotated tile inside the frame

      // Messier than a grid: scattered cluster centres instead of cells.
      const centres = Array.from({ length: 26 }, () => ({
        x: PAD + rnd() * (W - PAD * 2),
        y: PAD + rnd() * (H - PAD * 2),
      }));

      const tiles = [];
      for (let i = 0; i < 230; i += 1) {
        const c = centres[Math.floor(rnd() * centres.length)];
        const w = Math.round(BASE * (0.72 + rnd() * 0.9)); // 0.72x .. 1.62x
        const h = Math.round(w * 1.34);
        const x = c.x + (rnd() - 0.5) * 240;
        const y = c.y + (rnd() - 0.5) * 190;

        // Whole tiles only: the rotated bounds must fit inside the frame.
        const reach = Math.ceil((Math.hypot(w, h) / 2) + AMP + 2);
        if (x - reach < 0 || y - reach < 0 || x + reach > W || y + reach > H) continue;

        tiles.push({
          x, y, w, h,
          rot: (rnd() - 0.5) * 76,   // up to +/-38 degrees
          ph: rnd() * Math.PI * 2,
          spin: (rnd() - 0.5) * 5,
          back: rnd() < 0.5,
          face: Math.floor(rnd() * 5),
          glyph: WINDS[Math.floor(rnd() * 4)],
          pips: 1 + Math.floor(rnd() * 6),
        });
      }

      const stage = document.getElementById('stage');
      stage.innerHTML = tiles.map((t, i) => {
        let inner = '';
        if (!t.back) {
          if (t.face === 0) inner = `<span class="g g--wind" style="font-size:${t.w * 0.5}px">${t.glyph}</span>`;
          else if (t.face === 1) inner = `<span class="g g--red" style="font-size:${t.w * 0.54}px">中</span>`;
          else if (t.face === 2) inner = `<span class="g g--green" style="font-size:${t.w * 0.54}px">發</span>`;
          else if (t.face === 3) inner = `<span class="frame"></span>`;
          else inner = `<span class="pips" style="gap:4px">${'<i style="width:10px;height:10px"></i>'.repeat(t.pips)}</span>`;
        }
        return `<i class="t ${t.back ? 't--back' : ''}" data-i="${i}"
          style="left:${t.x - t.w / 2}px;top:${t.y - t.h / 2}px;width:${t.w}px;height:${t.h}px;transform:rotate(${t.rot}deg)">${inner}</i>`;
      }).join('');

      const els = [...stage.querySelectorAll('.t')];
      window.__count = tiles.length;

      // Small orbit per tile: the mass moves against itself, but only a little,
      // so the overall drift stays uniform across the screen.
      window.setPhase = (p) => {
        const a = p * Math.PI * 2;
        tiles.forEach((t, i) => {
          const dx = Math.cos(a + t.ph) * AMP;
          const dy = Math.sin(a + t.ph * 1.3) * AMP * 0.8;
          const rot = t.rot + Math.sin(a + t.ph) * t.spin;
          els[i].style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px) rotate(${rot.toFixed(2)}deg)`;
        });
      };
      window.setPhase(0);
    </script>
  </body>
</html>
