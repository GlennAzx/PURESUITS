<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>transition capture v2</title>
    <style>
      /* Capture-only. Whole tiles only: any tile whose rotated bounds would
         cross the frame is dropped, so nothing is cut off at the sprite edge.
         Gaps are allowed — the app paints a blue field behind the sprite. */
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
      #stage { position: relative; width: 100vw; height: 100vh; }

      /* Flat on the felt. A 1px contact shadow only — anything larger reads as
         a tile lifting off the table, which is not what a wash looks like. */
      .t {
        position: absolute;
        border-radius: 4px;
        display: grid;
        place-items: center;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(40, 30, 20, 0.26);
        background: linear-gradient(180deg, #fffdf6 0%, #f4f1e4 68%, #e6e1cf 100%);
      }
      /* Backs are green, the way the plain side of a mahjong tile reads: the
         same jade family as the site's tile wall, not a pink shell. */
      .t--back {
        background: linear-gradient(180deg, #cfe7d6 0%, #a8cdb6 58%, #7aa88c 100%);
        border-color: rgba(28, 60, 44, 0.34);
      }
      .g { font-family: "Noto Serif SC", "Microsoft YaHei", serif; font-weight: 700; line-height: 1; }
      .g--wind { color: #22384f; }
      .g--red { color: #b02a1c; }
      .g--green { color: #1c6b3c; }
      .frame { width: 58%; height: 68%; border: 2px solid #2b5fa8; border-radius: 2px; }
      .pips { display: grid; grid-template-columns: repeat(3, 1fr); place-items: center; width: 62%; height: 70%; }
      .pips i { border-radius: 50%; background: #22384f; display: block; }
      .pips i:nth-child(3n + 1) { background: #b02a1c; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      const W = window.innerWidth;
      const H = window.innerHeight;
      const WINDS = ['東', '南', '西', '北'];

      function seeded(a) {
        return function next() {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = seeded(44821);

      // A wash is tiles lying FLAT and touching, slid around in circles. They
      // never stack and never overlap. So this is a lattice, not a scatter:
      // every tile owns a cell, the cell is 1.3x the tile, and the tilt is
      // capped so a rotated tile still fits inside its own cell.
      const TILT = 10;              // degrees. Larger breaks the cell fit.
      const SLIDE = 5;              // px of circular slide inside the cell
      const PAD = 46;
      // Derive the cell from the frame so the lattice fills it, and keep the
      // cell at the tile's own aspect so the gaps stay even.
      const cols = Math.round((W - PAD * 2) / 104);
      const cw = (W - PAD * 2) / cols;
      const ch = cw * 1.34;
      const rows = Math.round((H - PAD * 2) / ch);
      const tw = Math.round(cw / 1.26);
      const th = Math.round(ch / 1.26);

      // Each row is shifted sideways by a random amount. That alone kills the
      // column alignment: tiles still never overlap, but the field stops
      // reading as a spreadsheet.
      const rowShift = Array.from({ length: rows }, () => (rnd() - 0.5) * cw * 0.8);

      const tiles = [];
      for (let r = 0; r < rows; r += 1) {
        for (let c = 0; c < cols; c += 1) {
          // Size varies per tile; smaller tiles leave a wider gap, which is what
          // a hand-swirled field actually looks like.
          const s = 0.84 + rnd() * 0.16;
          const w = Math.round(tw * s);
          const h = Math.round(th * s);
          const x = PAD + c * cw + cw / 2 + rowShift[r] + (rnd() - 0.5) * 8;
          const y = PAD + r * ch + ch / 2 + (rnd() - 0.5) * 6;

          // Whole tiles only, and inside this tile's own cell.
          const reach = Math.ceil(Math.hypot(w, h) / 2) + SLIDE + 2;
          if (x - reach < 2 || y - reach < 2 || x + reach > W - 2 || y + reach > H - 2) continue;

          tiles.push({
            x, y, w, h,
            rot: (rnd() - 0.5) * TILT * 2,
            ph: rnd() * Math.PI * 2,
            spin: (rnd() - 0.5) * 2.5,
            back: rnd() < 0.5,
            face: Math.floor(rnd() * 5),
            glyph: WINDS[Math.floor(rnd() * 4)],
            pips: 1 + Math.floor(rnd() * 6),
          });
        }
      }

      const stage = document.getElementById('stage');
      stage.innerHTML = tiles.map((t, i) => {
        let inner = '';
        if (!t.back) {
          if (t.face === 0) inner = `<span class="g g--wind" style="font-size:${t.w * 0.5}px">${t.glyph}</span>`;
          else if (t.face === 1) inner = `<span class="g g--red" style="font-size:${t.w * 0.54}px">中</span>`;
          else if (t.face === 2) inner = `<span class="g g--green" style="font-size:${t.w * 0.54}px">發</span>`;
          else if (t.face === 3) inner = `<span class="frame"></span>`;
          else inner = `<span class="pips" style="gap:4px">${'<i style="width:10px;height:10px"></i>'.repeat(t.pips)}</span>`;
        }
        return `<i class="t ${t.back ? 't--back' : ''}" data-i="${i}"
          style="left:${t.x - t.w / 2}px;top:${t.y - t.h / 2}px;width:${t.w}px;height:${t.h}px;transform:rotate(${t.rot}deg)">${inner}</i>`;
      }).join('');

      const els = [...stage.querySelectorAll('.t')];
      window.__count = tiles.length;

      // Small orbit per tile: the mass moves against itself, but only a little,
      // so the overall drift stays uniform across the screen.
      window.setPhase = (p) => {
        const a = p * Math.PI * 2;
        tiles.forEach((t, i) => {
          // Circular slide, the way a palm pushes tiles around the felt. It
          // stays inside the cell, so neighbours never collide.
          const dx = Math.cos(a + t.ph) * SLIDE;
          const dy = Math.sin(a + t.ph) * SLIDE;
          const rot = t.rot + Math.sin(a + t.ph) * t.spin;
          els[i].style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px) rotate(${rot.toFixed(2)}deg)`;
        });
      };
      window.setPhase(0);
    </script>
  </body>
</html>
